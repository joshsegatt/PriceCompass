name: Manual Prisma Migrations

# This workflow is intentionally manual and will NOT run automatically.
# To execute migrations from GitHub, add the secret `PROD_DATABASE_URL` in
# your repository secrets (Settings → Secrets) with the production DB URL
# (the Render managed Postgres connection string). Then trigger this workflow
# from the Actions UI (Run workflow) when you want to deploy migrations.

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Run Prisma migrate deploy
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then echo "PROD_DATABASE_URL secret not set"; exit 1; fi
          npx prisma migrate deploy --schema=prisma/schema.prisma
